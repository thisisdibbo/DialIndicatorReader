40" y="614" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#64748B" font-weight="normal" text-anchor="start">Every ground symbol is the same net: tie the instrument, both transistors and the Arduino together. +5V is the Arduino's 5V pin.</text></svg>
